<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Web</title>
    <link rel="stylesheet" href="spotifyclone.css">
</head>
<body>
    
    <!-- CỘT SIDEBAR BÊN TRÁI -->
    <aside class="sidebar">
        <div class="sidebar-top">
            <div class="sidebar-icon search-icon" title="Tìm kiếm">
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </div>
            <a href="#/playlists" class="sidebar-icon" title="Trang chủ">
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
            </a>
            <a href="#/library" class="sidebar-icon" title="Thư viện">
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><path d="M4 22h14a2 2 0 0 0 2-2V7.5L14.5 2H6a2 2 0 0 0-2 2v4"></path><polyline points="14 2 14 8 20 8"></polyline><path d="M2 15h10"></path><path d="M2 19h10"></path></svg>
            </a>
        </div>

        <div class="sidebar-divider"></div>

        <div class="sidebar-playlists">
            <!-- [GIAI ĐOẠN 5] Thêm link Bài hát đã thích (Liked Songs) -->
            <a href="#/liked" class="playlist-avatar" style="background-color: #ff5500; display: flex; align-items: center; justify-content: center;" title="Bài hát đã thích">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="white"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            </a>
            <!--    <div class="playlist-avatar" style="background-color: #e91e63;"></div>
            <div class="playlist-avatar" style="background-color: #2196f3;"></div>    -->
        </div>
        <!-- Thêm link Credits ở dưới cùng -->
        <a href="#/credits" class="sidebar-credits-link" title="Thông tin bản quyền">
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
        </a>
    </aside>

    <!-- KHỐI NỘI DUNG CHÍNH -->
    <main class="main-wrapper">
        
        <!-- 1. Topbar -->
        <header class="topbar">
            <div class="topbar-left">
                <input type="text" id="search-input" class="search-input" placeholder="Tìm bài hát, playlist...">
            </div>
            
            <div class="topbar-center">
                <a href="#/playlists" class="tab-btn active" data-tab="playlists">Playlists</a>
                <a href="#/podcasts" class="tab-btn" data-tab="podcasts">Podcasts</a>
                <a href="#/artists" class="tab-btn" data-tab="artists">Artists</a>
                <a href="#/albums" class="tab-btn" data-tab="albums">Albums</a>
            </div>

            <div class="topbar-right">
                <button class="theme-btn" id="theme-toggle" title="Đổi màu giao diện">🎨</button>
                <div class="user-avatar"></div>
            </div>
        </header>

        <!-- 2. Vùng nội dung (JS sẽ render vào đây) -->
        <div class="content-area" id="app-content">
            <!-- Nội dung sẽ được JS tự động tạo dựa trên Hash -->
        </div>

        <!-- 3. Player dưới cùng -->
        <footer class="player">
            <!-- Bên trái: Thông tin bài hát -->
            <div class="player-left">
                <div class="player-cover" id="player-cover" style="background-color: #555;"></div>
                <div class="player-info">
                    <div class="player-title" id="player-title">Chưa phát bài nào</div>
                    <div class="player-artist" id="player-artist">Nghệ sĩ</div>
                </div>
            </div>

            <!-- Ở giữa: Điều khiển & Progress bar -->
            <div class="player-center">
                <div class="player-controls">
                    <button class="control-btn">🔀</button>
                    <button class="control-btn">⏮</button>
                    <button class="control-btn play-btn" id="btn-play-pause">▶</button>
                    <button class="control-btn">⏭</button>
                    <button class="control-btn">🔁</button>
                </div>
                <div class="player-progress">
                    <span class="time" id="time-current">0:00</span>
                    <div class="progress-bar" id="progress-bar">
                        <div class="progress-fill" id="progress-fill" style="width: 0%;"></div>
                    </div>
                    <span class="time" id="time-total">0:00</span>
                </div>
            </div>

            <!-- Bên phải: Âm lượng -->
            <div class="player-right">
                <button class="control-btn">🔊</button>
                <div class="volume-bar">
                    <div class="volume-fill"></div>
                </div>
            </div>
        </footer>

    </main>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
